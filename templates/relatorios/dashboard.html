{% extends 'base.html' %}
{% block title %}Relatórios Gerenciais{% endblock %}

{% block content %}
<a href="{% url 'core:dashboard' %}" class="btn btn-secondary btn-sm" style="margin-bottom:16px;display:inline-flex;align-items:center;gap:6px;">← Voltar</a>

<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-bottom:24px">

  <a href="{% url 'relatorios:dre' %}" class="card" style="text-decoration:none;display:block;padding:20px;transition:box-shadow 0.2s" onmouseover="this.style.boxShadow='0 4px 12px rgba(0,0,0,0.1)'" onmouseout="this.style.boxShadow=''">
    <div style="width:40px;height:40px;border-radius:8px;background:#dbeafe;display:flex;align-items:center;justify-content:center;margin-bottom:12px;font-size:20px">📊</div>
    <div style="font-weight:700;color:#1e293b;margin-bottom:4px">DRE</div>
    <div style="font-size:13px;color:#6b7280">Demonstrativo de Resultado</div>
  </a>

  <a href="{% url 'relatorios:fluxo_caixa' %}" class="card" style="text-decoration:none;display:block;padding:20px;transition:box-shadow 0.2s" onmouseover="this.style.boxShadow='0 4px 12px rgba(0,0,0,0.1)'" onmouseout="this.style.boxShadow=''">
    <div style="width:40px;height:40px;border-radius:8px;background:#dcfce7;display:flex;align-items:center;justify-content:center;margin-bottom:12px;font-size:20px">💰</div>
    <div style="font-weight:700;color:#1e293b;margin-bottom:4px">Fluxo de Caixa</div>
    <div style="font-size:13px;color:#6b7280">Movimentações por período</div>
  </a>

  <a href="{% url 'relatorios:contas_pagar' %}" class="card" style="text-decoration:none;display:block;padding:20px;transition:box-shadow 0.2s" onmouseover="this.style.boxShadow='0 4px 12px rgba(0,0,0,0.1)'" onmouseout="this.style.boxShadow=''">
    <div style="width:40px;height:40px;border-radius:8px;background:#fee2e2;display:flex;align-items:center;justify-content:center;margin-bottom:12px;font-size:20px">📤</div>
    <div style="font-weight:700;color:#1e293b;margin-bottom:4px">Contas a Pagar</div>
    <div style="font-size:13px;color:#6b7280">Pendentes e atrasadas</div>
  </a>

  <a href="{% url 'relatorios:contas_receber' %}" class="card" style="text-decoration:none;display:block;padding:20px;transition:box-shadow 0.2s" onmouseover="this.style.boxShadow='0 4px 12px rgba(0,0,0,0.1)'" onmouseout="this.style.boxShadow=''">
    <div style="width:40px;height:40px;border-radius:8px;background:#dcfce7;display:flex;align-items:center;justify-content:center;margin-bottom:12px;font-size:20px">📥</div>
    <div style="font-weight:700;color:#1e293b;margin-bottom:4px">Contas a Receber</div>
    <div style="font-size:13px;color:#6b7280">Pendentes e atrasadas</div>
  </a>

</div>
{% endblock %}
